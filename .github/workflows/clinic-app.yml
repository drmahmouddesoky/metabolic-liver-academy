# Fatty Liver Clinic desktop app: tests on every change, installers for Windows and Mac.
# A tag "clinic-v1.2.3" publishes the installers on the Releases page.
name: Clinic app

on:
  push:
    paths: ["clinic-app/**", ".github/workflows/clinic-app.yml"]
    tags: ["clinic-v*"]
  pull_request:
    paths: ["clinic-app/**"]
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: clinic-app

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: clinic-app/package-lock.json }
      - run: npm ci
      - run: npm test

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            cmd: npm run dist:win
            files: dist/*.exe
          - os: macos-latest
            cmd: npm run dist:mac
            files: dist/*.dmg
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: clinic-app/package-lock.json }
      - run: npm ci
      - run: ${{ matrix.cmd }}
      - uses: actions/upload-artifact@v4
        with:
          name: FattyLiverClinic-${{ matrix.os }}
          path: clinic-app/${{ matrix.files }}
          if-no-files-found: error
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/clinic-v')
        uses: softprops/action-gh-release@v2
        with:
          files: clinic-app/${{ matrix.files }}
          name: Fatty Liver Clinic ${{ github.ref_name }}
          body: "Windows: download the -win-x64.exe installer, or the -win-portable.exe to run without installing. Mac: download the .dmg for your chip (arm64 = Apple silicon, x64 = Intel). See clinic-app/README.md for first-launch steps."
