# Site checks: run on every pull request and every change to main.
# They catch mistakes before visitors see them:
#   1. the pages were rebuilt after editing src/ or content/ (build.py)
#   2. every page carries its Content Security Policy, with no inline handlers;
#      locked course modules open only with a valid code
#   3. every calculator still gives the right answer at known values and cut-offs
#   4. the Publication Radar parser still reads PubMed's format
# A red cross on GitHub means one of these failed; open the run to see which.
#
# Actions are pinned to a commit (the comment shows the version) so that a
# changed tag can never run different code here. Dependabot updates the pins.
name: Site checks

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - data/radar.js          # the daily Radar update needs no checks
      - data/radar-recent.js

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install tools
        run: |
          pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium

      - name: Pages are up to date with their sources
        run: |
          python build.py
          if ! git diff --quiet; then
            echo "::error::Generated pages differ from src/ and content/. Run 'python3 build.py' and commit the result."
            git status --short
            exit 1
          fi

      - name: Every page has its security policy
        run: python tests/test_csp.py

      - name: No access codes or readable locked text in this public repository
        run: |
          if [ -d access ] || [ -d courses ]; then
            echo "::error::access/ or courses/ belongs in the private repository only."
            exit 1
          fi

      - name: Locked modules open only with a valid code
        run: python tests/test_locked.py

      - name: Calculators give the right answers
        run: |
          python -m http.server 8765 >/dev/null 2>&1 &
          sleep 2
          python tests/test_fib4.py
          python tests/test_nfs.py
          python tests/test_calcs.py
          python tests/test_edges.py

      - name: Radar parser
        run: python tests/test_radar.py
