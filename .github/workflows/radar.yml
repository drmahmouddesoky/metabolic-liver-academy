# Publication Radar: refresh the paper list from PubMed every day.
# You can also run it by hand: GitHub > Actions > "Publication Radar" > "Run workflow".
#
# Security: the job may write only data/radar.js and data/radar-recent.js
# (the commit step adds nothing else), it runs stdlib Python only, and the
# actions are pinned to a commit. The optional NCBI key is a repository secret
# and is never written to the site.
name: Publication Radar

on:
  schedule:
    - cron: "17 3 * * *"   # every day at 03:17 GMT (06:17 Riyadh time)
  workflow_dispatch:        # "Run workflow" button
  push:
    branches: [main]
    paths:
      - scripts/radar_fetch.py
      - .github/workflows/radar.yml

permissions:
  contents: read

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write   # only this job may push, and only the two data files
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Check the parser
        run: python3 tests/test_radar.py

      - name: Fetch new papers from PubMed
        env:
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}   # optional
        run: python3 scripts/radar_fetch.py

      - name: Save the update
        run: |
          if git diff --quiet -- data/radar.js data/radar-recent.js; then
            echo "No change today."
            exit 0
          fi
          git config user.name "MLA Radar bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/radar.js data/radar-recent.js
          git commit -m "Publication Radar: daily update"
          git pull --rebase origin main
          git push
